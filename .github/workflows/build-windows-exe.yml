
name: Build NOTZYH Optimizer for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NOTZYH_Optimizer notzyh_optimizer.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NOTZYH_Optimizer_Windows10
          path: dist/NOTZYH_Optimizer.exe
